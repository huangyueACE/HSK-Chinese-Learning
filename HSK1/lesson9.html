<script>

},

// ===============================

const fillQuestions=[

// ===============================

const sentenceQuestions=[

hint:"我 / 有 / 一只 / 猫",

<script>


// =====================================
// 第一部分：生成生词复习
// =====================================


const vocabularyBox =
document.getElementById("vocabularyBox");


vocabulary.forEach(item=>{


let card=document.createElement("div");

card.className="word-card";


card.innerHTML=`

<h3>${item.word}</h3>

<div class="pinyin">
${item.pinyin}
</div>


<div class="english">
${item.english}
</div>


<div class="example">


<p>
${item.examplePinyin}
</p>


<p>
${item.example}
</p>


<p>
${item.translation}
</p>


</div>


`;



vocabularyBox.appendChild(card);



});





// =====================================
// 第二部分：生词连线
// =====================================



let selectedWord=null;

let selectedPinyin=null;

let selectedEnglish=null;


let matchScore=0;



const wordPool=
document.getElementById("wordPool");


const pinyinPool=
document.getElementById("pinyinPool");


const englishPool=
document.getElementById("englishPool");



// 随机排序函数

function shuffle(arr){

return arr.sort(()=>Math.random()-0.5);

}



// 生成三个池


let words =
shuffle([...matchWords]);


let pinyins =
shuffle([...matchWords]);


let englishs =
shuffle([...matchWords]);



words.forEach(item=>{


let div=document.createElement("div");

div.className="match-item";

div.innerText=item.word;


div.dataset.answer=item.word;


div.onclick=function(){

selectMatch(this,"word");

};


wordPool.appendChild(div);


});




pinyins.forEach(item=>{


let div=document.createElement("div");

div.className="match-item";

div.innerText=item.pinyin;


div.dataset.answer=item.word;


div.onclick=function(){

selectMatch(this,"pinyin");

};


pinyinPool.appendChild(div);


});




englishs.forEach(item=>{


let div=document.createElement("div");

div.className="match-item";

div.innerText=item.english;


div.dataset.answer=item.word;


div.onclick=function(){

selectMatch(this,"english");

};


englishPool.appendChild(div);


});






function selectMatch(element,type){


    // 如果已经完成，不允许再次选择
    if(element.classList.contains("matched")){
        return;
    }


    element.classList.add("selected");



    if(type==="word"){

        selectedWord=element;

    }


    if(type==="pinyin"){

        selectedPinyin=element;

    }


    if(type==="english"){

        selectedEnglish=element;

    }



    // 三个选项都选择后判断

    if(
        selectedWord &&
        selectedPinyin &&
        selectedEnglish
    ){


        let isCorrect =

        selectedWord.dataset.answer ===
        selectedPinyin.dataset.answer

        &&

        selectedWord.dataset.answer ===
        selectedEnglish.dataset.answer;



        if(isCorrect){


            matchScore++;


            // 正确：三个变绿色

            selectedWord.classList.remove("selected");
            selectedPinyin.classList.remove("selected");
            selectedEnglish.classList.remove("selected");


            selectedWord.classList.add("matched");
            selectedPinyin.classList.add("matched");
            selectedEnglish.classList.add("matched");


        }


        else{


            // 错误：取消选择颜色

            selectedWord.classList.remove("selected");

            selectedPinyin.classList.remove("selected");

            selectedEnglish.classList.remove("selected");


        }



        selectedWord=null;

        selectedPinyin=null;

        selectedEnglish=null;



    }



}



document.querySelectorAll(
".section button"
)[0].onclick=function(){


document.getElementById("matchScore").innerHTML=

`
你的成绩：
${matchScore}/10

`;



};



// =====================================
// 第三部分：选词填空
// =====================================


const fillBox=
document.getElementById("fillBox");



let fillAnswers=[];



fillQuestions.forEach((q,index)=>{


let div=document.createElement("div");


div.style.margin="25px 0";



let options=
shuffle([...q.options]);



div.innerHTML=`

<p>
${index+1}.
${q.sentence.replace(
"____",
`<span class="blank" id="blank${index}">
____
</span>`
)}

</p>


<div class="word-bank">


${options.map(word=>`

<span class="drag-word"
onclick="
chooseWord('${word}',${index})
">

${word}

</span>

`).join("")}


</div>


`;



fillAnswers.push({

index:index,

answer:q.answer,

user:""

});


fillBox.appendChild(div);



});






function chooseWord(word,index){


document.getElementById(
"blank"+index
).innerText=word;



fillAnswers[index].user=word;



}





document.querySelectorAll(
".section button"
)[1].onclick=function(){


let score=0;


let result="";



fillAnswers.forEach((item,i)=>{


if(item.user===item.answer){


score++;


}

else{


result+=`

<p class="wrong">

第${i+1}题

正确答案：
${item.answer}

</p>

`;

}


});



document.getElementById(
"fillScore"
).innerHTML=

`

你的成绩：
${score}/10

${result}

`;



};









// =====================================
// 第四部分：看图造句
// =====================================



const pictureBox=
document.getElementById(
"pictureBox"
);



let sentenceAnswers=[];



sentenceQuestions.forEach((q,index)=>{


let div=document.createElement("div");


div.style.margin="30px 0";


div.innerHTML=`

<h2>
${q.image}
</h2>


<p>

提示词：

${q.hint}

</p>


<input

class="answer-input"

id="sentence${index}"

placeholder="请输入句子"

>


`;


pictureBox.appendChild(div);



sentenceAnswers.push(q);



});





document.querySelectorAll(
".section button"
)[2].onclick=function(){


let score=0;

let result="";



sentenceAnswers.forEach((item,index)=>{


let answer=
document.getElementById(
"sentence"+index
).value.trim();



if(answer===item.answer){


score+=2;


}

else{


result+=`

<p class="wrong">

第${index+1}题

正确答案：

${item.answer}

</p>

`;


}


});



document.getElementById(
"sentenceScore"
).innerHTML=

`

你的成绩：
${score}/10

${result}

`;



};




</script>
