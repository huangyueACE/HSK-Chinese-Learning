<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
HSK1 第9课《你儿子在哪儿工作》在线练习
</title>


<style>

/* =========================
   页面整体
========================= */

body{

    font-family:
    "Microsoft YaHei",
    Arial,
    sans-serif;

    background:#f8f8fc;

    margin:0;

    padding:20px;

    color:#333;

}


.container{

    max-width:1100px;

    margin:auto;

}


/* =========================
   标题
========================= */


.header{

    background:#d96b9b;

    color:white;

    padding:30px;

    border-radius:20px;

    text-align:center;

}


.header h1{

    margin:0;

    font-size:36px;

}


.header p{

    font-size:18px;

}



/* =========================
   每个学习模块
========================= */


.section{

    background:white;

    margin-top:25px;

    padding:25px;

    border-radius:20px;

    box-shadow:
    0 5px 15px rgba(0,0,0,0.08);

}



.section h2{

    color:#d96b9b;

    border-left:8px solid #d96b9b;

    padding-left:15px;

}



/* =========================
   生词卡片
========================= */


#vocabularyBox{


    display:grid;

    grid-template-columns:
    repeat(2,1fr);


    gap:20px;


}



.word-card{


    border:1px solid #eee;

    border-radius:15px;

    padding:20px;


    background:#fff;


}



.word-card h3{


    font-size:32px;

    color:#d96b9b;

    margin:0;


}


.pinyin{

    color:#666;

    font-size:20px;

}


.english{

    color:#444;

}



.example{


    background:#faf4f7;

    padding:15px;

    border-radius:10px;


}



/* =========================
   连线练习
========================= */


.match-container{


    display:flex;

    justify-content:space-between;

    gap:20px;


}



.match-column{


    width:33%;


}


.match-item{


    background:#f5f7ff;

    border-radius:12px;

    padding:15px;

    margin:10px;


    text-align:center;

    cursor:pointer;


}


.match-item:hover{


    background:#ffe5f0;


}


.selected{


    background:#ffb6d2 !important;

}



/* =========================
拖拽填空
========================= */


.word-bank{


    display:flex;

    flex-wrap:wrap;

    gap:10px;


}



.drag-word{


    background:#8ecae6;

    color:white;

    padding:10px 18px;

    border-radius:10px;

    cursor:pointer;


}



.blank{


    display:inline-block;

    min-width:80px;

    border-bottom:2px solid #d96b9b;

    text-align:center;

}



/* =========================
输入练习
========================= */


.answer-input{


    width:90%;

    padding:12px;

    border-radius:10px;

    border:1px solid #ccc;

    font-size:18px;


}


/* =========================
按钮
========================= */


.submit-btn{


    background:#d96b9b;

    color:white;

    border:none;

    padding:12px 30px;

    border-radius:25px;

    font-size:18px;

    cursor:pointer;


}


.submit-btn:hover{


    background:#bd507f;


}



/* =========================
评分
========================= */


.score-box{


    margin-top:20px;

    font-size:22px;

    color:#d96b9b;


}


.correct{


    color:green;

}


.wrong{


    color:red;

}



/* =========================
手机适配
========================= */


@media(max-width:700px){


#vocabularyBox{


    grid-template-columns:1fr;


}



.match-container{


    flex-direction:column;


}



.match-column{


    width:100%;


}


}


</style>


</head>



<body>


<div class="container">



<!-- =========================
页面标题
========================= -->


<div class="header">


<h1>
HSK1 第9课《你儿子在哪儿工作》
</h1>


<p>
Lesson 9: Where Does Your Son Work?
</p>


<p>
学习目标：
地点表达 · 职业词汇 · “在哪儿工作”
</p>


</div>





<!-- =========================
第一部分 生词复习
========================= -->


<div class="section">


<h2>
一、生词复习 Vocabulary Review
</h2>


<div id="vocabularyBox">


<!-- JavaScript生成生词 -->


</div>


</div>






<!-- =========================
第二部分 连线
========================= -->


<div class="section">


<h2>
二、生词连线 Match Words （10分）
</h2>


<div class="match-container">


<div class="match-column">

<h3>
生词
</h3>

<div id="wordPool">

</div>


</div>




<div class="match-column">


<h3>
拼音
</h3>


<div id="pinyinPool">

</div>


</div>





<div class="match-column">


<h3>
英文
</h3>


<div id="englishPool">

</div>


</div>


</div>



<button class="submit-btn">

提交答案

</button>


<div class="score-box" id="matchScore">


</div>



</div>






<!-- =========================
第三部分 选词填空
========================= -->


<div class="section">


<h2>
三、选词填空 Fill in the blanks （10分）
</h2>


<div id="fillBox">


<!-- JS生成 -->


</div>


<button class="submit-btn">

提交答案

</button>


<div class="score-box" id="fillScore">

</div>


</div>






<!-- =========================
第四部分 看图造句
========================= -->


<div class="section">


<h2>
四、看图写句子 Make Sentences （10分）
</h2>


<div id="pictureBox">


<!-- JS生成 -->


</div>


<button class="submit-btn">

提交答案

</button>



<div class="score-box" id="sentenceScore">

</div>


</div>






</div>



<!-- JavaScript 第3部分加入 -->


</body>

</html>
