()=>Math.random()-0.5
);

function createMatchExercise(){



let pinyinPool=document.getElementById(
"pinyinPool"
);


let englishPool=document.getElementById(
"englishPool"
);


let matchArea=document.getElementById(
"matchArea"
);



pinyinPool.innerHTML="";


englishPool.innerHTML="";


matchArea.innerHTML="";




// 生成拼音池


shuffle(
matchList
).forEach(item=>{


pinyinPool.innerHTML+=`

<div class="card" draggable="true">

${item.pinyin}

</div>

`;


});




// 生成英文池


shuffle(
matchList
).forEach(item=>{


englishPool.innerHTML+=`

<div class="card" draggable="true">

${item.english}

</div>


`;

});




//生成10道题


matchList.forEach(
(item,index)=>{


matchArea.innerHTML+=`

<div class="question">


<b>

${index+1}.
${item.word}

</b>


<br>


拼音：

<span

class="answer-box"

id="match-p-${index}"

>

</span>



<br>


英文：

<span

class="answer-box"

id="match-e-${index}"

>

</span>



</div>


`;


});


}









// =================================================
// 三、拖拽功能
// =================================================


document.addEventListener(

"dragstart",

function(e){


if(
e.target.classList.contains("card")
){


e.dataTransfer.setData(

"text/plain",

e.target.innerText.trim()

);


}

}

);





document.addEventListener(

"dragover",

function(e){


if(
e.target.classList.contains("answer-box")
){

e.preventDefault();

}


}

);






document.addEventListener(

"drop",

function(e){


if(
e.target.classList.contains("answer-box")
){


e.preventDefault();


let text=

e.dataTransfer.getData(
"text/plain"
);



e.target.innerHTML=text;



}


}

);








// =================================================
// 二、匹配题评分
// =================================================


function checkMatch(){


let score=0;


let result="";



matchList.forEach(
(item,index)=>{


let p=

document.getElementById(

"match-p-"+index

).innerText.trim();



let e=

document.getElementById(

"match-e-"+index

).innerText.trim();




if(
p===item.pinyin
&&
e===item.english
){


score++;


result+=`

<p class="correct">

✔ ${item.word}

</p>

`;

}

else{


result+=`

<p class="wrong">

✘ ${item.word}

<br>

正确答案：

${item.pinyin}

<br>

${item.english}

</p>

`;

}



});





document.getElementById(

"matchResult"

).innerHTML=

`

你的成绩：

${score}/10


<hr>


${result}

`;



}
